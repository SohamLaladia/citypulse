<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CITYPULSE — Making Every Civic Voice Count</title>
  
  <!-- SEO & Open Graph Meta -->
  <meta name="description" content="CityPulse is an AI-powered civic complaint management platform for Theme 1: Civic Pulse – Digital Governance and Public Information.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300D2FF' stroke-width='2.5'><path d='M22 12h-4l-3 9L9 3l-3 9H2'/></svg>">

  <!-- Google Fonts: Plus Jakarta Sans, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            navy: {
              950: '#070D1E',
              900: '#0B132B',
              850: '#101A38',
              800: '#131F42',
              700: '#1C2541',
              600: '#273559',
            },
            electric: {
              300: '#7DD3FC',
              400: '#38BDF8',
              500: '#00D2FF',
              600: '#0284C7',
            },
            civic: {
              blue: '#2563EB',
              darkBlue: '#1D4ED8',
            }
          }
        }
      }
    }
  </script>

  <!-- Chart.js for High-Fidelity Responsive Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <!-- Custom CityPulse Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-navy-900 text-slate-100 min-h-screen flex flex-col selection:bg-cyan-500 selection:text-navy-950">

  <!-- Top Sticky Navigation Bar -->
  <div id="navbar-container"></div>

  <!-- Main Dynamic Application Container -->
  <main id="app-content" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <!-- Views inject here dynamically via Router -->
  </main>

  <!-- Footer Container -->
  <div id="footer-container"></div>

  <!-- Core Scripts -->
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/mockDb.js"></script>
  <script src="js/assistantChat.js"></script>
  <script src="js/components.js"></script>
  
  <!-- Views -->
  <script src="js/views/landing.js"></script>
  <script src="js/views/citizenDashboard.js"></script>
  <script src="js/views/reportComplaint.js"></script>
  <script src="js/views/complaintTracking.js"></script>
  <script src="js/views/adminDashboard.js"></script>
  <script src="js/views/auth.js"></script>

  <!-- Main App Router & Bootstrapper -->
  <script src="js/app.js"></script>
</body>
</html>
